<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Shivam Dipte</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .thanks-section {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 5%;
        }
        .thanks-card {
            max-width: 500px;
            padding: 50px 30px;
        }
        .thanks-card i {
            font-size: 5rem;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
        }
        .thanks-card h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .thanks-card p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Ambient Background Animation -->
    <div class="ambient-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <section class="thanks-section" id="home">
        <div class="glass-card thanks-card fade-up visible">
            <i class="far fa-check-circle"></i>
            <h1>Message Sent!</h1>
            <p>Thank you for reaching out. I have received your message and will get back to you as soon as possible.</p>
            <a href="index.html" class="btn btn-primary">Back to Home</a>
        </div>
    </section>

</body>
</html>
